<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScopeLease Graph View</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/graph.css?v=scopelease-bilingual-v8" />
  </head>
  <body>
    <main class="graph-shell">
      <header class="hud scopelease-window">
        <div>
          <strong>ScopeLease Impact</strong>
          <span id="repoLabel">Reading repository...</span>
        </div>
        <div id="workStatus" class="work-status">readPlan · avoidPlan · traceLedger</div>
        <div class="hud-stats">
          <span id="riskLabel" class="risk low">Low</span>
          <span id="graphCount">0 nodes / 0 edges</span>
          <span id="activityLabel" class="activity-label">Live idle</span>
          <span id="updatedLabel">-</span>
          <span class="language-toggle graph-language-toggle" role="group" aria-label="Language">
            <button type="button" data-locale-option="en" aria-pressed="true">EN</button>
            <button type="button" data-locale-option="ko" aria-pressed="false">한국어</button>
          </span>
          <button type="button" class="scope-toggle" data-scope-toggle aria-pressed="false" title="Show full stored KG">Full KG</button>
        </div>
      </header>

      <section id="resultFrame" class="result-frame kg-window">
        <strong>Workspace</strong>
        <span>Waiting for project inventory...</span>
      </section>

      <nav class="graph-controls" aria-label="Graph display controls">
        <button type="button" data-panel-toggle="left" aria-pressed="true" title="Hide Workspace panel">Workspace</button>
        <button type="button" data-panel-toggle="right" aria-pressed="true" title="Hide ScopeLease panel">ScopeLease</button>
      </nav>

      <svg id="graphCanvas" aria-label="ScopeLease knowledge graph"></svg>

      <aside id="decisionPanel" class="decision-panel scopelease-window">
        <strong>ScopeLease</strong>
        <span>Waiting for analysis.</span>
      </aside>
    </main>

    <script src="/graph-view.js?v=scopelease-bilingual-v8" type="module"></script>
  </body>
</html>
